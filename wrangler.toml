name = "sepay-thuchi"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Giao diện web (thư mục public) được phục vụ cùng Worker
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "sepay-thuchi"
database_id = "00000000-0000-0000-0000-000000000000" # THAY bằng ID in ra khi chạy: npx wrangler d1 create sepay-thuchi
migrations_dir = "migrations"

# Đối soát với SePay API mỗi 5 phút (gói Free dư sức)
[triggers]
crons = ["*/5 * * * *"]

[vars]
# Giá trị mặc định; chỉnh trong tab Thiết lập SePay trên giao diện
SEPAY_ENV = "sandbox"
# hmac (khuyến nghị) | apikey | none
WEBHOOK_AUTH = "hmac"
# Số giờ quét lại khi đối soát
SYNC_LOOKBACK_HOURS = "48"

# Bí mật: chỉ cần ADMIN_PASSWORD (npx wrangler secret put ADMIN_PASSWORD).
